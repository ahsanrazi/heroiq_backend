# Python backend connects to the shared Postgres run by heroiq-super-admin
# (container heroiq-postgres on host port 5433). DATABASE_URL is read from
# .env, which points at host.docker.internal:5433.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Local dev uses the local redis service below. The production Valkey
      # string (rediss://...:25061) belongs ONLY in the DO App Platform env
      # vars (encrypted), never committed here.
      - REDIS_URL=redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Background indexing worker — same image/code, no HTTP. Mirrors the separate
  # DO App Platform Worker component used in production.
  worker:
    build: .
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
    depends_on:
      - redis
    command: arq app.worker.WorkerSettings

  redis:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
